name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      - run: pytest -v

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # No SSH: GitHub-hosted runners have no fixed IP, so reaching the
      # instance over SSH would mean opening port 22 to the internet. SSM
      # Run Command needs zero inbound ports and no stored credentials —
      # the role above is assumed via OIDC, short-lived, and scoped to
      # exactly this repo + branch (see terraform/README.md and DEPLOY.md).
      - name: Deploy via SSM Run Command
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy proclubs bot @ ${{ github.sha }}" \
            --parameters "commands=[
              \"cd /home/ubuntu/Discord-Attendance-Bot\",
              \"git fetch origin\",
              \"git reset --hard ${{ github.sha }}\",
              \"/home/ubuntu/Discord-Attendance-Bot/.venv/bin/pip install -q -r requirements.txt\",
              \"systemctl restart proclubs\",
              \"sleep 5\",
              \"systemctl is-active proclubs\"
            ]" \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "Status" --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed: $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" --output text
            exit 1
          fi
